<div class="relative">
  <input
    type="text"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    autocomplete="off"
    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:placeholder-slate-500 dark:disabled:bg-slate-900"
  />

  @if (isLoading()) {
    <div
      class="absolute right-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 animate-spin rounded-full border-2 border-slate-300 border-t-blue-600 dark:border-slate-600 dark:border-t-blue-400"
    ></div>
  }

  @if (isOpen() && suggestions().length > 0) {
    <ul
      class="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-lg border border-slate-200 bg-white py-1 text-sm shadow-lg dark:border-slate-700 dark:bg-slate-800"
    >
      @for (s of suggestions(); track s.label + s.lat) {
        <li>
          <button
            type="button"
            (click)="choose(s)"
            class="block w-full px-3 py-2 text-left text-slate-700 hover:bg-blue-50 dark:text-slate-200 dark:hover:bg-slate-700"
          >
            {{ s.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
